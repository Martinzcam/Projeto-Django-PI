
{% extends 'core/base.html' %}

{% block title %}{{ titulo }}{% endblock %}

{% block content %}
    <h1>{{ titulo }}</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="botao">
            Salvar
        </button>

        <a href="{% url 'lista_tarefas' %}" class="botao">
            Cancelar
        </a>
    </form>
{% endblock %}
