
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Sistema de Projetos{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            color: #222;
        }

        nav {
            background-color: #222;
            padding: 15px 10%;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
            display: inline-block;
        }

        nav a:hover {
            color: #a8d5ff;
        }

        .container {
            width: 80%;
            max-width: 1200px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .botao {
            display: inline-block;
            padding: 10px 15px;
            background-color: #333;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .botao:hover {
            opacity: 0.8;
        }

        .excluir {
            background-color: #b00020;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background-color: #f7f7f7;
        }

        .mensagem {
            padding: 10px;
            background-color: #d4edda;
            color: #155724;
            margin-bottom: 20px;
            border-radius: 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        label {
            font-weight: bold;
        }

        @media (max-width: 600px) {
            nav {
                padding: 15px;
            }

            nav a {
                margin: 5px 10px 5px 0;
            }

            .container {
                width: 94%;
                padding: 15px;
            }

            table {
                font-size: 13px;
            }

            th, td {
                padding: 7px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="{% url 'lista_projetos' %}">Projetos</a>
        <a href="{% url 'criar_projeto' %}">Novo Projeto</a>
        <a href="{% url 'lista_tarefas' %}">Tarefas</a>
        <a href="{% url 'criar_tarefa' %}">Nova Tarefa</a>
    </nav>

    <div class="container">

        {% if messages %}
            {% for message in messages %}
                <div class="mensagem">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
